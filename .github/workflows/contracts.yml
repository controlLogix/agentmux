name: P01 contracts and broker qualification

on:
  push:
    branches: [feat/agentmux-platform-rearchitecture]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p01-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # DELIVERY-LOCAL-01: feature-branch verification stays off until all local P00-P14 gates are
  # accepted; keep the AGENTMUX_ALL_PHASES_COMPLETE variable unset/false until then. Set to 'true',
  # it runs these jobs on this branch's own events. workflow_dispatch alone cannot be the switch:
  # GitHub dispatches only workflows that exist on the default branch. tests/local/workflows.py
  # runs the same steps on a developer machine meanwhile.
  qualification:
    if: (github.ref == 'refs/heads/feat/agentmux-platform-rearchitecture' || github.head_ref == 'feat/agentmux-platform-rearchitecture') && ((github.ref != 'refs/heads/feat/agentmux-platform-rearchitecture' && github.head_ref != 'feat/agentmux-platform-rearchitecture') || vars.AGENTMUX_ALL_PHASES_COMPLETE == 'true')
    name: P01 native ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.8'
          # Download caches only: ci.py still installs the exact locked versions, and npm ci checks
          # every package against its lockfile integrity hash.
          cache: pip
          cache-dependency-path: |
            sdk/python/requirements.lock
            hub/requirements.lock
      - uses: actions/setup-node@v5
        with:
          node-version: '22.21.1'
          cache: npm
          cache-dependency-path: |
            sdk/typescript/package-lock.json
            tests/storage/typescript/package-lock.json
      - name: Build locked SDKs and run required checks
        run: python tests/contracts/ci.py --workspace "${{ runner.temp }}/agentmux-p01" --evidence "${{ runner.temp }}/agentmux-evidence"
      - name: Preserve execution evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/agentmux-evidence/
          if-no-files-found: error
          retention-days: 30

# These checks supply evidence for review. They do not update tasks, approve a
# phase, claim WSL coverage from native Linux, or authorize a merge.
