name: P01 contracts and broker qualification

on:
  push:
    branches: [feat/agentmux-platform-rearchitecture]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p01-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Automatic feature verification stays off. Enable manual verification only after
  # all local P00-P14 gates are accepted; keep AGENTMUX_ALL_PHASES_COMPLETE unset/false until then.
  qualification:
    if: (github.ref == 'refs/heads/feat/agentmux-platform-rearchitecture' || github.head_ref == 'feat/agentmux-platform-rearchitecture') && ((github.ref != 'refs/heads/feat/agentmux-platform-rearchitecture' && github.head_ref != 'feat/agentmux-platform-rearchitecture') || (github.event_name == 'workflow_dispatch' && vars.AGENTMUX_ALL_PHASES_COMPLETE == 'true'))
    name: P01 native ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.8'
      - uses: actions/setup-node@v5
        with:
          node-version: '22.21.1'
      - name: Build locked SDKs and run required checks
        run: python tests/contracts/ci.py --workspace "${{ runner.temp }}/agentmux-p01" --evidence "${{ runner.temp }}/agentmux-evidence"
      - name: Preserve execution evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/agentmux-evidence/
          if-no-files-found: error
          retention-days: 30

# These checks supply evidence for review. They do not update tasks, approve a
# phase, claim WSL coverage from native Linux, or authorize a merge.
