name: Tests

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a running check, except on main, where every commit keeps its result.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The suites that need no tmux session, agent CLI or NATS server. The live federation
# suites (test_fed_live, test_nats_federation) skip themselves without nats-server/nsc,
# and dashboard/run_tests.sh needs tmux and spawned agents, so both of those are run
# locally (docs/FEDERATION.md 12.1 records those runs).
jobs:
  # DELIVERY-LOCAL-01: feature-branch verification stays off until all local P00-P14 gates are
  # accepted; keep the AGENTMUX_ALL_PHASES_COMPLETE variable unset/false until then. Set to 'true',
  # it runs these jobs on this branch's own events. workflow_dispatch alone cannot be the switch:
  # GitHub dispatches only workflows that exist on the default branch. tests/local/workflows.py
  # runs the same steps on a developer machine meanwhile.
  tests:
    if: (github.ref != 'refs/heads/feat/agentmux-platform-rearchitecture' && github.head_ref != 'feat/agentmux-platform-rearchitecture') || vars.AGENTMUX_ALL_PHASES_COMPLETE == 'true'
    runs-on: ubuntu-latest
    # The documented test path (PYTHONPATH=sdk/python:.), absolute so the Hubs and CLIs the tests
    # start from other directories import the same agentmux_contracts.
    env:
      PYTHONPATH: ${{ github.workspace }}/sdk/python:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            hub/requirements.txt
            hub/requirements.lock
            sdk/python/requirements.lock
      - name: Syntax
        run: |
          bash dashboard/syntax_check.sh
          python -m py_compile hub/*.py hub/fed/*.py hub/fed/plugins/*.py hub/fed/hooks/*.py
      # The Hub imports agentmux_contracts from sdk/python, so its locked dependencies install too.
      - name: Federation and contract dependencies (pinned by hub/requirements.lock and sdk/python/requirements.lock)
        run: python -m pip install -r sdk/python/requirements.lock -r hub/requirements.txt -c hub/requirements.lock
      - name: Hub and federation
        run: python -m unittest -v hub.tests.test_local_runner hub.tests.test_governance hub.tests.test_hub_offline hub.tests.test_fed_unit hub.tests.test_nats_federation hub.tests.test_fed_live
      - name: Dashboard
        run: |
          python dashboard/test_fed_panel.py
          python dashboard/test_host_guard.py
